workflows:
  # ─────────────────────────────────────────────
  # ANDROID — Play Store (Internal / Production)
  # ─────────────────────────────────────────────
  android-release:
    name: Diario Scuola Plus — Android
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      android_signing:
        - ithelpdesk_android
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.diarioscuolaplus.app"
        GOOGLE_PLAY_TRACK: internal
      node: 20
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: release/*
          include: true
    scripts:
      - name: Install dependencies
        script: npm ci
      # NOTE: VITE_USE_UNITY_ADS=true is temporary — AdMob account pub-1151868778464777
      # was suspended for invalid traffic on ~2026-08-21 (29-day suspension).
      # Revert (drop VITE_USE_UNITY_ADS=true) once ads are reinstated in the AdMob dashboard.
      - name: Build web app
        script: VITE_USE_UNITY_ADS=true npm run build
      - name: Generate icons and splash
        script: npm run assets:generate
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Set build number (from Google Play)
        script: |
          set +e
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --tracks=internal,alpha,beta,production)
          echo "google-play get-latest-build-number output: '$LATEST'"
          set -e
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then
            echo "Could not parse a build number, defaulting LATEST=1 (versionCode 1 is already published)"
            LATEST=1
          fi
          BUILD_NUMBER=$((LATEST + 1))
          echo "Using BUILD_NUMBER=$BUILD_NUMBER"
          sed -i "s/versionCode [0-9]\+/versionCode $BUILD_NUMBER/" android/app/build.gradle
          grep versionCode android/app/build.gradle
      - name: Build release AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/logs/*
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        track: $GOOGLE_PLAY_TRACK
        submit_as_draft: true

  # ─────────────────────────────────────────────
  # iOS — App Store / TestFlight
  # ─────────────────────────────────────────────
  ios-release:
    name: Diario Scuola Plus — iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Ikonet Solutions"
    environment:
      groups:
        - diario_admob
      ios_signing:
        provisioning_profiles:
          - diario_appstore_v3
        certificates:
          - lexiguess_distribution
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "6790534929"
        BUNDLE_ID: "com.diarioscuolaplus.app"
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: release/*
          include: true
    scripts:
      - name: Install dependencies
        script: npm ci
      # capacitor-unity-ads@1.0.0's Swift source doesn't compile against the
      # UnityAds SDK version its own podspec requires (~> 4.9.2): several
      # delegate methods were renamed and UnityAds.initialize() no longer
      # accepts closures (it takes a UnityAdsInitializationDelegate object).
      # This rewrites the plugin's iOS source with the corrected API calls,
      # confirmed against Unity's official Objective-C example app. Safe to
      # remove once upstream (https://github.com/eliazv/capacitor-unity-ads)
      # ships a fix and we bump the npm dependency.
      - name: Patch capacitor-unity-ads iOS plugin for current UnityAds SDK API
        script: |
          cat > node_modules/capacitor-unity-ads/ios/Sources/UnityadsPlugin/Unityads.swift <<'SWIFT_EOF'
          import Foundation
          import UnityAds

          @objc public class Unityads: NSObject {
              private var isInitialized = false
              private var testMode = false
              private var currentRewardedPlacementId: String?
              private var currentInterstitialPlacementId: String?
              var rewardedVideoLoaded = false
              var interstitialLoaded = false
              private var pendingInitCallback: InitializationCallback?

              // Callback types
              typealias InitializationCallback = (Bool, String?) -> Void
              typealias AdLoadCallback = (Bool, String?) -> Void
              typealias RewardedVideoCallback = (Bool, [String: Any]?, String?) -> Void
              typealias InterstitialCallback = (Bool, String?) -> Void

              func initialize(gameId: String, testMode: Bool, callback: @escaping InitializationCallback) {
                  print("[UnityAds] Initializing with Game ID: \(gameId)")

                  self.testMode = testMode
                  self.pendingInitCallback = callback

                  UnityAds.initialize(gameId, testMode: testMode, initializationDelegate: InitializationDelegate(parent: self))
              }

              func handleInitializationComplete() {
                  print("[UnityAds] Initialized successfully")
                  isInitialized = true
                  pendingInitCallback?(true, nil)
                  pendingInitCallback = nil
              }

              func handleInitializationFailed(message: String) {
                  print("[UnityAds] Initialization failed: \(message)")
                  pendingInitCallback?(false, message)
                  pendingInitCallback = nil
              }

              func loadRewardedVideo(placementId: String, callback: @escaping AdLoadCallback) {
                  guard isInitialized else {
                      callback(false, "Unity Ads not initialized")
                      return
                  }

                  print("[UnityAds] Loading rewarded video with placement ID: \(placementId)")

                  currentRewardedPlacementId = placementId
                  rewardedVideoLoaded = false

                  UnityAds.load(placementId, loadDelegate: RewardedVideoLoadDelegate(callback: callback, parent: self))
              }

              func showRewardedVideo(callback: @escaping RewardedVideoCallback) {
                  guard isInitialized else {
                      callback(false, nil, "Unity Ads not initialized")
                      return
                  }

                  guard let placementId = currentRewardedPlacementId, rewardedVideoLoaded else {
                      callback(false, nil, "Rewarded video not loaded")
                      return
                  }

                  guard let rootViewController = UIApplication.shared.windows.first?.rootViewController else {
                      callback(false, nil, "No root view controller available")
                      return
                  }

                  print("[UnityAds] Showing rewarded video")

                  UnityAds.show(rootViewController, placementId: placementId, showDelegate: RewardedVideoShowDelegate(callback: callback, parent: self))
              }

              func isRewardedVideoLoaded() -> Bool {
                  return rewardedVideoLoaded && currentRewardedPlacementId != nil
              }

              func loadInterstitial(placementId: String, callback: @escaping AdLoadCallback) {
                  guard isInitialized else {
                      callback(false, "Unity Ads not initialized")
                      return
                  }

                  print("[UnityAds] Loading interstitial with placement ID: \(placementId)")

                  currentInterstitialPlacementId = placementId
                  interstitialLoaded = false

                  UnityAds.load(placementId, loadDelegate: InterstitialLoadDelegate(callback: callback, parent: self))
              }

              func showInterstitial(callback: @escaping InterstitialCallback) {
                  guard isInitialized else {
                      callback(false, "Unity Ads not initialized")
                      return
                  }

                  guard let placementId = currentInterstitialPlacementId, interstitialLoaded else {
                      callback(false, "Interstitial not loaded")
                      return
                  }

                  guard let rootViewController = UIApplication.shared.windows.first?.rootViewController else {
                      callback(false, "No root view controller available")
                      return
                  }

                  print("[UnityAds] Showing interstitial")

                  UnityAds.show(rootViewController, placementId: placementId, showDelegate: InterstitialShowDelegate(callback: callback, parent: self))
              }

              func isInterstitialLoaded() -> Bool {
                  return interstitialLoaded && currentInterstitialPlacementId != nil
              }

              func setTestMode(enabled: Bool) {
                  print("[UnityAds] Setting test mode: \(enabled)")
                  self.testMode = enabled
                  // Unity Ads test mode is set during initialization
              }

              func getVersion() -> String {
                  return UnityAds.getVersion() ?? "unknown"
              }
          }

          // MARK: - Initialization Delegate

          class InitializationDelegate: NSObject, UnityAdsInitializationDelegate {
              private weak var parent: Unityads?

              init(parent: Unityads) {
                  self.parent = parent
              }

              func initializationComplete() {
                  parent?.handleInitializationComplete()
              }

              func initializationFailed(_ error: UnityAdsInitializationError, withMessage message: String) {
                  parent?.handleInitializationFailed(message: message)
              }
          }

          // MARK: - Load Delegates

          class RewardedVideoLoadDelegate: NSObject, UnityAdsLoadDelegate {
              private let callback: Unityads.AdLoadCallback
              private weak var parent: Unityads?

              init(callback: @escaping Unityads.AdLoadCallback, parent: Unityads) {
                  self.callback = callback
                  self.parent = parent
              }

              func unityAdsAdLoaded(_ placementId: String) {
                  print("[UnityAds] Rewarded video loaded successfully")
                  parent?.rewardedVideoLoaded = true
                  callback(true, nil)
              }

              func unityAdsAdFailed(toLoad placementId: String, withError error: UnityAdsLoadError, withMessage message: String) {
                  print("[UnityAds] Rewarded video failed to load: \(message)")
                  parent?.rewardedVideoLoaded = false
                  callback(false, "Failed to load rewarded video: \(message)")
              }
          }

          class InterstitialLoadDelegate: NSObject, UnityAdsLoadDelegate {
              private let callback: Unityads.AdLoadCallback
              private weak var parent: Unityads?

              init(callback: @escaping Unityads.AdLoadCallback, parent: Unityads) {
                  self.callback = callback
                  self.parent = parent
              }

              func unityAdsAdLoaded(_ placementId: String) {
                  print("[UnityAds] Interstitial loaded successfully")
                  parent?.interstitialLoaded = true
                  callback(true, nil)
              }

              func unityAdsAdFailed(toLoad placementId: String, withError error: UnityAdsLoadError, withMessage message: String) {
                  print("[UnityAds] Interstitial failed to load: \(message)")
                  parent?.interstitialLoaded = false
                  callback(false, "Failed to load interstitial: \(message)")
              }
          }

          // MARK: - Show Delegates

          class RewardedVideoShowDelegate: NSObject, UnityAdsShowDelegate {
              private let callback: Unityads.RewardedVideoCallback
              private weak var parent: Unityads?

              init(callback: @escaping Unityads.RewardedVideoCallback, parent: Unityads) {
                  self.callback = callback
                  self.parent = parent
              }

              func unityAdsShowStart(_ placementId: String) {
                  print("[UnityAds] Rewarded video show started")
              }

              func unityAdsShowClick(_ placementId: String) {
                  print("[UnityAds] Rewarded video clicked")
              }

              func unityAdsShowComplete(_ placementId: String, withFinish state: UnityAdsShowCompletionState) {
                  print("[UnityAds] Rewarded video show completed with state: \(state.rawValue)")

                  parent?.rewardedVideoLoaded = false // Reset loaded state

                  if state == .showCompletionStateCompleted {
                      // User watched the full video, give reward
                      let reward = ["type": "coins", "amount": 1] as [String: Any]
                      callback(true, reward, nil)
                  } else {
                      // User skipped or ad was not completed
                      callback(false, nil, nil)
                  }
              }

              func unityAdsShowFailed(_ placementId: String, withError error: UnityAdsShowError, withMessage message: String) {
                  print("[UnityAds] Rewarded video show failed: \(message)")
                  parent?.rewardedVideoLoaded = false
                  callback(false, nil, "Failed to show rewarded video: \(message)")
              }
          }

          class InterstitialShowDelegate: NSObject, UnityAdsShowDelegate {
              private let callback: Unityads.InterstitialCallback
              private weak var parent: Unityads?

              init(callback: @escaping Unityads.InterstitialCallback, parent: Unityads) {
                  self.callback = callback
                  self.parent = parent
              }

              func unityAdsShowStart(_ placementId: String) {
                  print("[UnityAds] Interstitial show started")
                  callback(true, nil)
              }

              func unityAdsShowClick(_ placementId: String) {
                  print("[UnityAds] Interstitial clicked")
              }

              func unityAdsShowComplete(_ placementId: String, withFinish state: UnityAdsShowCompletionState) {
                  print("[UnityAds] Interstitial show completed")
                  parent?.interstitialLoaded = false // Reset loaded state
              }

              func unityAdsShowFailed(_ placementId: String, withError error: UnityAdsShowError, withMessage message: String) {
                  print("[UnityAds] Interstitial show failed: \(message)")
                  parent?.interstitialLoaded = false
                  callback(false, "Failed to show interstitial: \(message)")
              }
          }
          SWIFT_EOF
      # NOTE: VITE_USE_UNITY_ADS=true is temporary — AdMob account pub-1151868778464777
      # was suspended for invalid traffic on ~2026-08-21 (29-day suspension).
      # Revert (drop VITE_USE_UNITY_ADS=true) once ads are reinstated in the AdMob dashboard.
      - name: Build web app (con AdMob/Unity Ads IDs)
        script: |
          ADMOB_BANNER="${DIARIO_ADMOB_BANNER_ID:-ca-app-pub-3940256099942544/2934735716}"
          ADMOB_INTERSTITIAL="${DIARIO_ADMOB_INTERSTITIAL_ID:-ca-app-pub-3940256099942544/4411468910}"
          VITE_ADMOB_BANNER_ID="$ADMOB_BANNER" \
          VITE_ADMOB_INTERSTITIAL_ID="$ADMOB_INTERSTITIAL" \
          VITE_USE_UNITY_ADS=true \
          npm run build
      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios/App" ]; then
            # `cap add ios` scaffolds the project (incl. Podfile) then runs an
            # internal `pod install`, which fails here because UnityAds ships
            # a static xcframework and Capacitor's default Podfile uses
            # dynamic `use_frameworks!`. Scaffolding still completes before
            # the pod-install sub-step, so we tolerate this specific failure
            # and fix linkage in the next step before pods are (re)installed.
            npx cap add ios || echo "cap add ios: ignoring known pod-install failure (static UnityAds xcframework), Podfile will be patched next"
          fi
      - name: Patch Podfile for Unity Ads static linkage
        script: |
          if ! grep -q ":linkage => :static" ios/App/Podfile; then
            sed -i '' "s/^use_frameworks!$/use_frameworks! :linkage => :static/" ios/App/Podfile
          fi
      - name: Generate icons and splash
        script: npm run assets:generate
      - name: Patch Info.plist permissions
        script: bash scripts/patch-ios-plist.sh
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Set build number
        script: |
          if [ -n "$APP_STORE_APPLE_ID" ] && [ "$APP_STORE_APPLE_ID" != "0000000000" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
            BUILD_NUMBER=$((LATEST + 1))
          else
            BUILD_NUMBER=$BUILD_NUMBER
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.1" ios/App/App/Info.plist 2>/dev/null || true
      - name: Verify iOS bundle identifier
        script: |
          DETECTED=$(xcode-project detect-bundle-id --project ios/App/App.xcodeproj)
          echo "Bundle ID rilevato: $DETECTED"
          if [ "$DETECTED" != "$BUNDLE_ID" ]; then
            echo "ERRORE: bundle ID atteso $BUNDLE_ID, trovato $DETECTED"
            exit 1
          fi
      - name: Apply provisioning profiles
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --verbose \
            --disable-xcpretty \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true

  # ─────────────────────────────────────────────
  # WEB — Privacy policy + app demo (Vercel alt.)
  # ─────────────────────────────────────────────
  web-static:
    name: Diario Scuola Plus — Web Static
    max_build_duration: 15
    instance_type: linux_x2
    environment:
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install and build
        script: |
          npm ci
          npm run build
      - name: Verify legal pages
        script: |
          test -f dist/privacy-policy.html || (echo "privacy-policy.html mancante" && exit 1)
          test -f dist/terms.html || (echo "terms.html mancante" && exit 1)
          test -f dist/support.html || (echo "support.html mancante" && exit 1)
          echo "OK: pagine legali/supporto presenti in dist/"
    artifacts:
      - dist/**/*
