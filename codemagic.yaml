workflows:
  # ─────────────────────────────────────────────
  # ANDROID — Play Store (Internal / Production)
  # ─────────────────────────────────────────────
  android-release:
    name: Diario Scuola Plus — Android
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      android_signing:
        - ithelpdesk_android
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.diarioscuolaplus.app"
        GOOGLE_PLAY_TRACK: internal
        ADMOB_APP_ID_ANDROID: ca-app-pub-1151868778464777~3370534174
        DIARIO_ADMOB_BANNER_ID_ANDROID: ca-app-pub-1151868778464777/1158294646
      node: 22
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: release/*
          include: true
    scripts:
      - name: Install dependencies
        script: npm ci
      # Ads (AdMob only): App Open at launch / on return, interstitial every 2 sections
      # (45 s apart), banner, rewarded video. See src/monetization/ads.ts.
      - name: Build web app
        script: |
          VITE_ADMOB_BANNER_ID_ANDROID="${DIARIO_ADMOB_BANNER_ID_ANDROID:-}" \
          VITE_ADMOB_APP_OPEN_ID_ANDROID=ca-app-pub-1151868778464777/8110016079 \
          VITE_ADMOB_INTERSTITIAL_ID_ANDROID=ca-app-pub-1151868778464777/1343308074 \
          VITE_ADMOB_REWARDED_ID_ANDROID=ca-app-pub-1151868778464777/5379910954 \
          VITE_ADS_TEST_MODE=false \
          npm run build
      - name: Generate icons and splash
        script: npm run assets:generate
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Set build number (from Google Play)
        script: |
          set +e
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --tracks=internal,alpha,beta,production)
          echo "google-play get-latest-build-number output: '$LATEST'"
          set -e
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then
            echo "Could not parse a build number, defaulting LATEST=1 (versionCode 1 is already published)"
            LATEST=1
          fi
          BUILD_NUMBER=$((LATEST + 1))
          # Draft releases are not reported by get-latest-build-number, so never go
          # below a date-based code (yy + day of year + HHMM, e.g. 262892040).
          DATE_NUMBER=$(date -u +%y%j%H%M)
          if [ "$DATE_NUMBER" -gt "$BUILD_NUMBER" ]; then BUILD_NUMBER=$DATE_NUMBER; fi
          echo "Using BUILD_NUMBER=$BUILD_NUMBER"
          sed -i "s/versionCode [0-9]\+/versionCode $BUILD_NUMBER/" android/app/build.gradle
          grep versionCode android/app/build.gradle
      - name: Build release AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/logs/*
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        track: $GOOGLE_PLAY_TRACK
        submit_as_draft: true

  # ─────────────────────────────────────────────
  # iOS — App Store / TestFlight
  # ─────────────────────────────────────────────
  ios-release:
    name: Diario Scuola Plus — iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Ikonet Solutions"
    environment:
      groups:
        - diario_admob
      ios_signing:
        provisioning_profiles:
          - diario_appstore_20260930
        certificates:
          - ithelpdesk_distribution_20260916
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "6790534929"
        BUNDLE_ID: "com.diarioscuolaplus.app"
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: release/*
          include: true
    scripts:
      - name: Install dependencies
        script: npm ci
      # Ads (AdMob only): App Open at launch / on return, interstitial every 2 sections
      # (45 s apart), banner, rewarded video. See src/monetization/ads.ts.
      - name: Build web app (ads + IAP)
        script: |
          VITE_ADMOB_BANNER_ID_IOS="${DIARIO_ADMOB_BANNER_ID:-}" \
          VITE_ADMOB_APP_OPEN_ID_IOS=ca-app-pub-1151868778464777/1698531293 \
          VITE_ADMOB_INTERSTITIAL_ID_IOS="${DIARIO_ADMOB_INTERSTITIAL_ID:-ca-app-pub-1151868778464777/6955549876}" \
          VITE_ADMOB_REWARDED_ID_IOS=ca-app-pub-1151868778464777/2919279477 \
          VITE_ADS_TEST_MODE=false \
          npm run build
      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios --packagemanager CocoaPods
          fi
      - name: Podfile platform (iOS 15 for Capacitor 8 / native-purchases)
        script: |
          sed -i '' "s/^platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
          grep "platform :ios" ios/App/Podfile
      - name: Localize iOS project (16 languages)
        script: |
          gem install xcodeproj --user-install --no-document
          export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH"
          ruby scripts/localize-ios.rb
      - name: Generate icons and splash
        script: npm run assets:generate
      - name: Patch Info.plist permissions
        script: bash scripts/patch-ios-plist.sh
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Set build number
        script: |
          if [ -n "$APP_STORE_APPLE_ID" ] && [ "$APP_STORE_APPLE_ID" != "0000000000" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
            BUILD_NUMBER=$((LATEST + 1))
          else
            BUILD_NUMBER=$BUILD_NUMBER
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 2.2" ios/App/App/Info.plist 2>/dev/null || true
      - name: Verify iOS bundle identifier
        script: |
          DETECTED=$(xcode-project detect-bundle-id --project ios/App/App.xcodeproj)
          echo "Bundle ID rilevato: $DETECTED"
          if [ "$DETECTED" != "$BUNDLE_ID" ]; then
            echo "ERRORE: bundle ID atteso $BUNDLE_ID, trovato $DETECTED"
            exit 1
          fi
      - name: Apply provisioning profiles
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --verbose \
            --disable-xcpretty \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true

  # ─────────────────────────────────────────────
  # WEB — Privacy policy + app demo (Vercel alt.)
  # ─────────────────────────────────────────────
  web-static:
    name: Diario Scuola Plus — Web Static
    max_build_duration: 15
    instance_type: linux_x2
    environment:
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install and build
        script: |
          npm ci
          npm run build
      - name: Verify legal pages
        script: |
          test -f dist/privacy-policy.html || (echo "privacy-policy.html mancante" && exit 1)
          test -f dist/terms.html || (echo "terms.html mancante" && exit 1)
          test -f dist/support.html || (echo "support.html mancante" && exit 1)
          echo "OK: pagine legali/supporto presenti in dist/"
    artifacts:
      - dist/**/*
